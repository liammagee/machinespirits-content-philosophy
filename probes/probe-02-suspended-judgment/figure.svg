<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Suspended judgment as an inquiry sequence</title>
  <desc id="desc">An ambiguous learner response branches into several hypotheses, followed by a discriminating question, new evidence, and a revisable diagnosis.</desc>
  <rect width="960" height="420" fill="#f7f4ef"/>
  <g fill="none" stroke="#6b6660" stroke-width="3">
    <path d="M180 210H310"/>
    <path d="M310 210C360 210 355 90 420 90"/>
    <path d="M310 210H420"/>
    <path d="M310 210C360 210 355 330 420 330"/>
    <path d="M540 90C600 90 595 210 650 210" stroke-dasharray="7 8"/>
    <path d="M540 210H650" stroke-dasharray="7 8"/>
    <path d="M540 330C600 330 595 210 650 210" stroke-dasharray="7 8"/>
    <path d="M770 210H850"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(120 210)">
      <circle r="66" fill="#b8654a"/>
      <text y="-9" fill="#fff" font-size="18" font-weight="700">Ambiguous</text>
      <text y="17" fill="#fff" font-size="18">response</text>
    </g>
    <g fill="#fff" font-size="16" font-weight="700">
      <g transform="translate(480 90)"><rect x="-70" y="-34" width="140" height="68" rx="12" fill="#7a8a4f"/><text y="6">Hypothesis A</text></g>
      <g transform="translate(480 210)"><rect x="-70" y="-34" width="140" height="68" rx="12" fill="#c8954b"/><text y="6" fill="#1c1a16">Hypothesis B</text></g>
      <g transform="translate(480 330)"><rect x="-70" y="-34" width="140" height="68" rx="12" fill="#5a6c7d"/><text y="6">Hypothesis C</text></g>
    </g>
    <g transform="translate(710 210)">
      <circle r="64" fill="#6b4423"/>
      <text y="-9" fill="#fff" font-size="17" font-weight="700">Discriminating</text>
      <text y="17" fill="#fff" font-size="17">question</text>
    </g>
    <g transform="translate(890 210)">
      <circle r="52" fill="#2f5d62"/>
      <text y="-8" fill="#fff" font-size="15" font-weight="700">Revisable</text>
      <text y="15" fill="#fff" font-size="15">diagnosis</text>
    </g>
    <text x="480" y="392" fill="#1c1a16" font-size="18">Keep alternatives live only until a question supplies distinguishing evidence.</text>
  </g>
</svg>

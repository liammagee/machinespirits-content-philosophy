function go(i, push = true) {

}
function toggleNotes(force) {
  const n = $('notes'), show = force == null ? n.hidden : force;

function toggleOverview(force) {

$('next').addEventListener('click', () => go(cur === slides.length - 1 ? 0 : cur + 1));
$('prev').addEventListener('click', () => go(cur - 1));
$('dots').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); });
$('ov-list').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { go(+b.dataset.i); toggleOverview(false); } });
$('ov-close').addEventListener('click', () => toggleOverview(false));
document.querySelector('.tools').addEventListener('click', e => {
  const t = e.target.closest('[data-tool]'); if (!t) return;
  ({ notes: () => toggleNotes(), overview: () => toggleOverview(), fullscreen })[t.dataset.tool]();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$('overview').hidden) { if (e.key === 'Escape' || e.key === 'o' || e.key === 'O') toggleOverview(false); return; }
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slides.length - 1);
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
  else if (e.key === 'o' || e.key === 'O') toggleOverview(true);
  else if (e.key === 'f' || e.key === 'F') fullscreen();
});
let tx = null;
$('stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('stage').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 70) go(dx < 0 ? cur + 1 : cur - 1); });
addEventListener('hashchange', () => { const m = location.hash.match(/^#s(\d+)$/); if (m) go(+m[1] - 1, false); });

if (new URLSearchParams(location.search).get('notes') === '1') toggleNotes(true);
const m0 = location.hash.match(/^#s(\d+)$/);
go(m0 ? +m0[1] - 1 : 0, !m0);
})();
</script>
</body>
</html>

<!--
  Machine Spirits slide deck template.

  The whole deck is the DECK object in the <script id="deck-data"> block below:
  a title, a short label for the header, and an array of slides. Each slide
  has a "type" and a "notes" string (speaker notes; plain text, blank lines
  start new paragraphs). Every text field is escaped; inside it, *words*
  become emphasis (italic, gold in titles). Optional on every slide:
  "mark" (a movement numeral shown in a gold ring) and "kicker" (the small
  label above the title).

  Slide types and their fields:
    title      title, subtitle, meta, aiNote
    quote      quote, by, after
    divider    numeral, title, sub
    statement  title, body
    cards      title, intro, cards: [[head, body], ...], cols (2|3|4), footer, links ("both" draws ⇄ between two cards)
    flow       title, nodes: [label, ...], footer           (A → not-A → C)
    merge      title, from: [[head, body], ...], to: [head, body]
    rows       title, rows: [[from, to, who], ...]
    chips      title, intro, chips: [label, ...], footer, after
    timeline   title, eras: [[when, what], ...], footer
    steps      title, steps: [text, ...]
    questions  title, questions: [text, ...]
    readings   title, columns: [[item, ...], [item, ...]]

  Keys: → / Space next · ← back · Home / End · N notes · O overview · F fullscreen.
  Deep links: #s1 … #sN (1-based). ?notes=1 opens with the notes panel.
-->
<style>
:root{color-scheme:dark;--bg:#121021;--surface:#1c1a33;--card:#2a2646;--card-hi:#33304f;--line:#3a3450;--ink:#ece7f0;--muted:#a49db8;--lilac:#c7bfe0;--gold:#f0c9a0;--mint:#8fd6c2;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--u:min(1vw,1.78vh)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif)}
body{overflow:hidden}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
button:hover{border-color:#5d5580}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--mint)}
em{font-style:italic}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px}
.mark{font:italic 20px/1 var(--serif);color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{list-style:none;display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;justify-content:center}.dots button{width:16px;height:16px;min-height:0;padding:0;border:0;background:transparent;display:grid;place-items:center}.dots i{width:6px;height:6px;border-radius:50%;background:#4a4466;display:block;transition:transform .2s,background .2s}.dots button[aria-current=step] i{background:var(--gold);transform:scale(1.6)}.dots button.seen i{background:#8d86a8}
.tools{display:flex;gap:8px}.tools button{font:12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.tools button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.body{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.stage{position:relative;min-height:0;overflow:auto}
.slide{display:none;min-height:100%;padding:calc(var(--u)*3.2) calc(var(--u)*6);align-content:center}.slide.on{display:grid}
.slide>.wrap{width:min(1200px,100%);margin:0 auto;display:grid;gap:calc(var(--u)*2);position:relative}
.slide.on>.wrap{animation:rise .4s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font:calc(var(--u)*1.15)/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin:0}

.cards{display:grid;gap:calc(var(--u)*1.8)}

.card h3{margin:0;font-weight:400;font-size:calc(var(--u)*2.5);color:var(--gold)}.card p{margin:0;font-size:calc(var(--u)*2);line-height:1.35}
.cards.big h3{font-size:calc(var(--u)*3.3)}
.links{display:grid;grid-template-columns:1fr auto 1fr;gap:calc(var(--u)*2);align-items:center}.links .swap{font-size:calc(var(--u)*5);color:var(--gold)}
.flow{display:flex;align-items:center;gap:calc(var(--u)*2.4);flex-wrap:wrap}.node{width:calc(var(--u)*15);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);font-size:calc(var(--u)*3.6)}.node.last{border-color:var(--gold);color:var(--gold);background:var(--card-hi)}.arrow{font-size:calc(var(--u)*4);color:var(--gold)}
.merge{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.4fr);gap:calc(var(--u)*2.4);align-items:center}.merge .from{display:grid;gap:calc(var(--u)*1.6)}
.rows{display:grid;gap:calc(var(--u)*2)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) minmax(0,.6fr);gap:calc(var(--u)*2);align-items:center;font-size:calc(var(--u)*2.4)}.row .to{color:var(--gold)}.row .who{color:var(--lilac);font-size:calc(var(--u)*1.8)}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.2)}.chip{background:var(--card);border-radius:10px;padding:calc(var(--u)*1.4) calc(var(--u)*2.2);font-size:calc(var(--u)*2.2);color:var(--gold)}

.steps,.questions{display:grid;gap:calc(var(--u)*1.6);margin:0;padding:0;list-style:none;counter-reset:n}.steps li,.questions li{display:grid;grid-template-columns:calc(var(--u)*6) minmax(0,1fr);align-items:center;font-size:calc(var(--u)*2.5);line-height:1.3;counter-increment:n}.steps li::before,.questions li::before{content:counter(n);font-size:calc(var(--u)*4.4);color:var(--gold)}
.questions li{font-size:calc(var(--u)*2.8)}.questions li::before{font-size:calc(var(--u)*6)}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*3)}.readings ul{margin:0;padding-left:1.1em;display:grid;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*1.9);line-height:1.35}
.notes{width:min(420px,40vw);border-left:1px solid var(--line);background:#16142a;overflow:auto;padding:18px 22px;font:15px/1.6 Georgia,serif;color:#ddd6e6}.notes[hidden]{display:none}.notes h4{margin:0 0 10px;font:11px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400}.notes p{margin:0 0 12px}
.overview{position:fixed;inset:0;z-index:20;background:#121021f2;overflow:auto;padding:70px 28px 28px}.overview[hidden]{display:none}.overview ol{list-style:none;margin:0 auto;padding:0;max-width:1200px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.overview button{width:100%;text-align:left;display:grid;gap:6px;padding:14px;min-height:96px;background:var(--surface)}.overview button span{font:11px/1 var(--mono);color:var(--muted)}.overview button strong{font-weight:400;font-size:16px;line-height:1.3}.overview button[aria-current=true]{border-color:var(--gold)}.overview .close{position:fixed;top:18px;right:22px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 22px 14px}.nav .count{font:12px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.nav button.primary{background:var(--gold);border-color:var(--gold);color:#1b1726;font-weight:600;min-width:120px}
@media(max-width:760px){:root{--u:7px}.kicker{font-size:11px}.slide{align-content:start}.numeral{font-size:72px}body{overflow:auto}.app{height:auto;min-height:100dvh}.dots{display:none}.tools button[data-tool=fullscreen]{display:none}.slide{padding:28px 18px}.cards,.timeline,.readings{grid-template-columns:1fr!important}.links,.merge{grid-template-columns:1fr}.links .swap,.merge .arrow{transform:rotate(90deg);justify-self:center}.row{grid-template-columns:1fr;gap:4px}.row .arrow{display:none}.notes{position:fixed;inset:auto 0 0 0;width:auto;max-height:45vh;border-left:0;border-top:1px solid var(--line)}h1{font-size:40px}h2{font-size:28px}.quote{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{overflow:visible}.top,.nav,.notes,.overview{display:none!important}.app{display:block;height:auto}.slide{display:grid!important;min-height:100vh;page-break-after:always}}
</style>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Escape, then let *words* become <em>words</em>.
const md = s => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
const plain = s => String(s == null ? '' : s).replace(/\*/g, '');
const p = (cls, s, tag = 'p') => s ? `<${tag} class="${cls}">${md(s)}</${tag}>` : '';
const head = sl => `${sl.mark ? `<span class="ring" aria-label="Movement ${esc(sl.mark)}">${esc(sl.mark)}</span>` : ''}${p('kicker', sl.kicker)}${sl.title ? `<h2>${md(sl.title)}</h2>` : ''}`;
const card = ([h, b]) => `<div class="card"><h3>${md(h)}</h3>${b ? `<p>${md(b)}</p>` : ''}</div>`;

const RENDER = {
  title: sl => `<h1>${md(sl.title)}</h1>${p('sub', sl.subtitle)}${p('meta', sl.meta)}${p('ai', sl.aiNote)}`,
  quote: sl => `${sl.mark ? head({ mark: sl.mark }) : ''}<div class="qmark" aria-hidden="true">“</div><p class="quote">${md(sl.quote)}</p>${p('by', sl.by)}${p('after', sl.after)}`,
  divider: sl => `<div class="numeral" aria-hidden="true">${esc(sl.numeral)}</div><h2>${md(sl.title)}</h2>${p('sub', sl.sub)}`,
  statement: sl => `${head(sl)}${p('body-text', sl.body)}`,
  cards: sl => `${head(sl)}${p('intro', sl.intro)}${sl.links === 'both'
    ? `<div class="links">${card(sl.cards[0])}<span class="swap" aria-hidden="true">⇄</span>${card(sl.cards[1])}</div>`
    : `<div class="cards${sl.big ? ' big' : ''}" style="grid-template-columns:repeat(${sl.cols || sl.cards.length},minmax(0,1fr))">${sl.cards.map(card).join('')}</div>`}${p('footer', sl.footer)}`,
  flow: sl => `${head(sl)}<div class="flow">${sl.nodes.map((n, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<div class="node${i === sl.nodes.length - 1 ? ' last' : ''}">${md(n)}</div>`).join('')}</div>${p('footer', sl.footer)}`,
  merge: sl => `${head(sl)}<div class="merge"><div class="from">${sl.from.map(card).join('')}</div><span class="arrow" aria-hidden="true">→</span>${card(sl.to)}</div>${p('footer', sl.footer)}`,
  rows: sl => `${head(sl)}<div class="rows">${sl.rows.map(([a, b, w]) => `<div class="row"><span>${md(a)}</span><span class="arrow" aria-hidden="true">→</span><span class="to">${md(b)}</span><span class="who">${md(w)}</span></div>`).join('')}</div>${p('footer', sl.footer)}`,
  chips: sl => `${head(sl)}${p('intro', sl.intro)}<div class="chips">${sl.chips.map(c => `<span class="chip">${md(c)}</span>`).join('')}</div>${p('meta', sl.footer)}${p('footer', sl.after)}`,
  timeline: sl => `${head(sl)}<div class="timeline">${sl.eras.map(([w, t], i) => `<div class="era${i === sl.eras.length - 1 ? ' last' : ''}"><span>${md(w)}</span><strong>${md(t)}</strong></div>`).join('')}</div>${p('meta', sl.footer)}`,
  steps: sl => `${head(sl)}<ol class="steps">${sl.steps.map(t => `<li><span>${md(t)}</span></li>`).join('')}</ol>`,
  questions: sl => `${head(sl)}<ol class="questions" start="${sl.start || 1}" style="counter-reset:n ${(sl.start || 1) - 1}">${sl.questions.map(t => `<li><span>${md(t)}</span></li>`).join('')}</ol>`,
  readings: sl => `${head(sl)}<div class="readings">${sl.columns.map(col => `<ul>${col.map(t => `<li>${md(t)}</li>`).join('')}</ul>`).join('')}</div>`,
};

const slides = DECK.slides;
document.title = plain(DECK.title);
$('mark').textContent = plain(DECK.label || DECK.title);
$('stage').innerHTML = slides.map((sl, i) => {
  const fn = RENDER[sl.type];
  const inner = fn ? fn(sl) : `<p class="meta">Unknown slide type: ${esc(sl.type)}</p>`;
  return `<section class="slide t-${esc(sl.type)}" id="s${i + 1}" aria-label="Slide ${i + 1}"><div class="wrap">${inner}</div></section>`;
}).join('');
const titleOf = sl => plain(sl.title || sl.quote || sl.kicker || sl.type);
$('dots').innerHTML = slides.map((sl, i) => `<li><button type="button" data-i="${i}" title="${esc(titleOf(sl))}" aria-label="Slide ${i + 1}: ${esc(titleOf(sl))}"><i></i></button></li>`).join('');
$('ov-list').innerHTML = slides.map((sl, i) => `<li><button type="button" data-i="${i}"><span>${i + 1}</span><strong>${esc(titleOf(sl))}</strong></button></li>`).join('');

const els = [...document.querySelectorAll('.slide')];
const seen = new Set();
let cur = -1;
function go(i, push = true) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur) return;
  cur = i; seen.add(i);
  els.forEach((e, k) => e.classList.toggle('on', k === i));
  document.querySelectorAll('#dots button').forEach(b => { const k = +b.dataset.i; b.setAttribute('aria-current', k === i ? 'step' : 'false'); b.classList.toggle('seen', seen.has(k) && k !== i); });
  document.querySelectorAll('#ov-list button').forEach(b => b.setAttribute('aria-current', String(+b.dataset.i === i)));
  $('count').textContent = `${i + 1} / ${slides.length}`;
  $('prev').disabled = i === 0;
  $('next').textContent = i === slides.length - 1 ? 'Start again' : 'Next →';
  $('notes').innerHTML = `<h4>Notes · slide ${i + 1}</h4>` + (slides[i].notes ? String(slides[i].notes).split(/\n\s*\n/).map(t => `<p>${esc(t)}</p>`).join('') : '<p>No notes.</p>');
  $('stage').scrollTop = 0;
  if (push) history.replaceState(null, '', location.pathname + location.search + '#s' + (i + 1));
}
function toggleNotes(force) {
  const n = $('notes'), show = force == null ? n.hidden : force;
  n.hidden = !show;
  document.querySelector('[data-tool=notes]').setAttribute('aria-pressed', String(show));
}
function toggleOverview(force) {
  const o = $('overview'), show = force == null ? o.hidden : force;
  o.hidden = !show;
  if (show) (o.querySelector('[aria-current=true]') || o.querySelector('button[data-i]')).focus();
}
function fullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
$('next').addEventListener('click', () => go(cur === slides.length - 1 ? 0 : cur + 1));
$('prev').addEventListener('click', () => go(cur - 1));
$('dots').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); });
$('ov-list').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { go(+b.dataset.i); toggleOverview(false); } });
$('ov-close').addEventListener('click', () => toggleOverview(false));
document.querySelector('.tools').addEventListener('click', e => {
  const t = e.target.closest('[data-tool]'); if (!t) return;
  ({ notes: () => toggleNotes(), overview: () => toggleOverview(), fullscreen })[t.dataset.tool]();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$('overview').hidden) { if (e.key === 'Escape' || e.key === 'o' || e.key === 'O') toggleOverview(false); return; }
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slides.length - 1);
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
  else if (e.key === 'o' || e.key === 'O') toggleOverview(true);
  else if (e.key === 'f' || e.key === 'F') fullscreen();
});
let tx = null;
$('stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('stage').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 70) go(dx < 0 ? cur + 1 : cur - 1); });
addEventListener('hashchange', () => { const m = location.hash.match(/^#s(\d+)$/); if (m) go(+m[1] - 1, false); });

if (new URLSearchParams(location.search).get('notes') === '1') toggleNotes(true);
const m0 = location.hash.match(/^#s(\d+)$/);
go(m0 ? +m0[1] - 1 : 0, !m0);
})();
</script>

<style>
/* Layout: a full-bleed 3D field. A compact header card at the top left, a reading drawer at the right,
   a movable toolbar (bottom centre by default), and one slim legend strip along the bottom.
   The look follows the Lecture 1 deck: ink #15161D, paper #F3EEE4, orange, blue and teal, Space Grotesk and
   Source Serif 4, flat panels with chunky borders and pill buttons. Dark (ink) is the default; light is paper. */
:root {
  --bg: #15161D; --panel: #1C1D27; --panel-2: #23253A; --border: #3A3C4E; --rule: #2C2E3D;
  --fg: #F3EEE4; --fg-2: #C9C4B8; --muted: #9C978C;
  --accent: #FF7A50; --accent-ink: #FF7A50; --on-accent: #15161D; --blue: #7F9BE8; --teal: #4FC3B0; --ok: #7BD88F; --on-c: #15161D;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3EEE4; --panel: #FBF8F2; --panel-2: #E8E1D3; --border: #15161D; --rule: #DDD5C6;
  --fg: #15161D; --fg-2: #4A4A55; --muted: #6A6670;
  --accent: #F2552C; --accent-ink: #B83A16; --on-accent: #15161D; --blue: #2F4FA8; --teal: #1F7A70; --ok: #2B7A3E; --on-c: #FFFFFF;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #F3EEE4; --panel: #FBF8F2; --panel-2: #E8E1D3; --border: #15161D; --rule: #DDD5C6;
  --fg: #15161D; --fg-2: #4A4A55; --muted: #6A6670;
  --accent: #F2552C; --accent-ink: #B83A16; --on-accent: #15161D; --blue: #2F4FA8; --teal: #1F7A70; --ok: #2B7A3E; --on-c: #FFFFFF;
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
#field { position: fixed; inset: 0; }
.panel { box-sizing: border-box; position: fixed; z-index: 2; background: var(--panel); border: 2px solid var(--border); border-radius: 18px; }
@keyframes appear { from { opacity: 0; } }
#caption { animation: appear .35s ease both; }
.eyebrow { font: 600 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--accent-ink); }
button { font: 600 13px/1 var(--display); border-radius: 999px; padding: 9px 14px; cursor: pointer; border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); }
button.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
button.ghost:hover { background: var(--panel-2); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible, .chip:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--blue); }
input, textarea, select { font: 400 15px/1.35 var(--body); color: var(--fg); background: var(--bg); border: 2px solid var(--border); border-radius: 10px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
textarea { resize: vertical; min-height: 64px; }
label { display: flex; flex-direction: column; gap: 5px; font: 600 12px/1.2 var(--display); color: var(--fg-2); }
label small { font: 400 12px/1.35 var(--body); color: var(--muted); }
.note { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.note.warn { color: var(--accent-ink); }

/* header card */
#head { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); width: min(300px, calc(100vw - 28px)); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
#head h1 { margin: 0; font: 700 21px/1.1 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.counts { display: flex; gap: 14px; font: 500 12px/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--fg); font: 700 15px/1 var(--display); margin-right: 3px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
#pop { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); width: min(340px, calc(100vw - 28px)); max-height: calc(100% - 120px); overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 4; }
#pop form { display: flex; flex-direction: column; gap: 10px; }
.keygate { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100vw - 32px)); padding: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 20; }
.keygate h2 { margin: 0; font: 700 22px/1.2 var(--display); }
.pophead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* drawer */
#drawer { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: min(330px, calc(100vw - 28px)); max-height: calc(100% - 150px); overflow: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 3; }
#drawer h2 { margin: 0; font: 600 19px/1.25 var(--body); text-wrap: balance; }
#drawer .meta { font: 400 13px/1.45 var(--display); color: var(--fg-2); }
#drawer.min > :not(.dhead) { display: none; }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dhead .row { flex-wrap: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.quote { margin: 0; font: italic 400 17px/1.5 var(--body); color: var(--fg); }
.abstract { margin: 0; font-size: 14px; line-height: 1.55; color: var(--fg-2); }
.abstract.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
a.cta { display: inline-block; font: 600 12px/1 var(--display); padding: 9px 13px; border-radius: 999px; background: var(--accent); color: var(--on-accent); text-decoration: none; border: 2px solid var(--accent); }
a.cta.alt { background: transparent; color: var(--fg); border-color: var(--border); }

/* toolbar: draggable */
#tools { left: 50%; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 5px; display: flex; gap: 3px; align-items: center; flex-wrap: wrap; width: max-content; max-width: calc(100vw - 28px); border-radius: 14px; touch-action: none; }
#tools.placed { transform: none; }
#tools { cursor: grab; }
#tools button:not(.grip) { cursor: pointer; }
#tools .sep { width: 2px; height: 22px; background: var(--rule); margin: 0 3px; border-radius: 2px; }
.icon { width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; border-radius: 10px; background: transparent; color: var(--fg); border: 2px solid transparent; }
.icon:hover { background: var(--panel-2); }
.icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.icon.grip { cursor: grab; color: var(--muted); width: 22px; }
.icon.grip:active { cursor: grabbing; }
.menu { position: fixed; z-index: 5; min-width: 220px; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.menu button.item { display: flex; justify-content: space-between; gap: 16px; width: 100%; text-align: left; background: transparent; color: var(--fg); border: 0; border-radius: 10px; padding: 9px 10px; font: 500 13px/1.2 var(--display); }
.menu button.item:hover { background: var(--panel-2); }
.menu kbd { font: 500 11px/1 var(--display); color: var(--muted); }
.menu .label { padding: 6px 10px 2px; }
.menu hr { border: 0; border-top: 2px solid var(--rule); margin: 4px 0; }
.menu form { display: flex; gap: 6px; padding: 4px; }
.menu form input { padding: 6px 8px; font-size: 14px; }
.menu form button { padding: 6px 10px; }
.view { display: flex; gap: 4px; align-items: center; }
.view button.item { flex: 1; }
.view .x { width: 28px; height: 28px; padding: 0; background: transparent; color: var(--muted); border: 0; border-radius: 8px; }
.view .x:hover { background: var(--panel-2); color: var(--fg); }

/* legend strip */
#legend { left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 6px 8px 6px 10px; display: flex; gap: 12px; align-items: center; border-radius: 14px; }
#chips { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 600 12px/1 var(--display); padding: 6px 10px; border-radius: 999px; border: 2px solid var(--c); color: var(--fg); background: transparent; white-space: nowrap; }
.chip:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
.chip[aria-pressed="true"] { background: var(--c); color: var(--on-c); }
#status { flex: none; font: 400 12px/1.3 var(--display); color: var(--muted); white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
#status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 7px; vertical-align: 0; }
#status.live i { background: var(--ok); animation: ping 1.8s ease-out infinite; }
#status.waiting i { background: var(--accent); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
body.bare .panel:not(#tools), body.bare .menu { display: none; }

#caption { position: fixed; z-index: 2; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); text-align: center; pointer-events: none; padding: 10px 16px; background: var(--panel); border: 2px solid var(--border); border-radius: 16px; }
#caption .eyebrow { margin-bottom: 6px; }
#caption .t { font: 600 18px/1.3 var(--body); color: var(--fg); text-wrap: balance; }
#tip { position: fixed; z-index: 6; max-width: 300px; pointer-events: none; padding: 7px 10px; border-radius: 10px; background: var(--panel); border: 2px solid var(--border); font: 400 13px/1.4 var(--body); color: var(--fg); }
#empty { position: fixed; z-index: 1; left: 50%; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(360px, calc(100vw - 32px)); text-align: center; pointer-events: none; color: var(--fg-2); font-size: 14px; line-height: 1.5; }
#empty strong { display: block; font: 600 15px/1.3 var(--display); color: var(--fg); margin-bottom: 4px; }
#toast { position: fixed; z-index: 7; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 9px 14px; border-radius: 999px; background: var(--fg); color: var(--bg); font: 600 13px/1 var(--display); }

@media (max-width: 760px) {
  #head { width: calc(100vw - 28px); }
  #drawer { top: auto; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); max-height: 46%; width: calc(100vw - 28px); }
  #tools .sep, #t-left, #t-up, #t-down, #t-right, #t-reset { display: none; }
  .icon { width: 32px; height: 32px; }
  #drawer { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  #status { display: none; }
  #legend:has(#chips:empty) { display: none; }

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

</style>

<script>
"use strict";
// Shared engine for the EPOL 590 boards: the 3D field, themes, the movable toolbar, focus mode,
// flythrough, saved views, PNG snapshots, CSV export, link copying and the status line.
// Each board (students.js, responses.js) supplies its data and its drawer content through Board.init().
const Board = (() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null && text !== "") e.textContent = text; if (cls) e.className = cls; return e; };
  const extLink = (text, href, cls) => { const a = el("a", text, cls); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const V3 = THREE.Vector3;

  // ------------------------------------------------------------ themes (match the Lecture 1 deck)
  const THEMES = {
    dark: { name: "dark", bg: "#15161D", fg: "#F3EEE4", muted: "#9C978C", dim: "#2A2C3A70", dust: "#9AA3C8", dustOpacity: .4, add: true, glow: 1,
      hues: ["#FF7A50", "#7F9BE8", "#4FC3B0", "#F5C542", "#FF6FA8", "#A98BFF", "#8FD16A", "#58C7F3", "#FFA94D", "#E07BE0"] },
    light: { name: "light", bg: "#F3EEE4", fg: "#15161D", muted: "#6A6670", dim: "#D5CCBC90", dust: "#A69A86", dustOpacity: .3, add: false, glow: .45,
      hues: ["#F2552C", "#2F4FA8", "#1F7A70", "#B7791F", "#C2185B", "#6B4FBB", "#3F7D2C", "#1C6EA4", "#C05621", "#8E3FA8"] },
  };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const saved = store.get("epol590-theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  const themeName = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  let theme = THEMES[themeName()] || THEMES.dark;
  let colorOf = new Map();
  function assignColors(keys) { const h = theme.hues; colorOf = new Map([...keys].sort().map((k, i) => [k, h[i % h.length]])); }
  const colorFor = (key) => colorOf.get(key) || theme.muted;

  // ------------------------------------------------------------ icons
  const ICON = {
    zin: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2M11 8v6M8 11h6"/>',
    zout: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2M8 11h6"/>',
    fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    reset: '<path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/>',
    up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    left: '<path d="M19 12H5M11 6l-6 6 6 6"/>', right: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    spin: '<ellipse cx="12" cy="12" rx="9" ry="3.6"/><circle cx="12" cy="12" r="1.6"/>',
    tour: '<path d="M3 18c4-1 6-4 8-8s5-5 10-5"/><circle cx="21" cy="5" r="1.3"/><circle cx="3" cy="18" r="1.3"/>',
    views: '<path d="M6 3h12v18l-6-4-6 4z"/>',
    snap: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    theme: '<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
    grip: '<circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/>',
    min: '<path d="M5 12h14"/>', max: '<path d="M5 12h14M12 5v14"/>', close: '<path d="M6 6l12 12M18 6L6 18"/>',
  };
  const svg = (name) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[name] + "</svg>";
  function iconButton(id, name, label, extra = "") { const b = el("button", "", "icon"); b.type = "button"; if (id) b.id = id; b.title = label + (extra ? " (" + extra + ")" : ""); b.setAttribute("aria-label", label); b.innerHTML = svg(name); return b; }

  // ------------------------------------------------------------ status, toast
  let baseStatus = ["", "Connecting…"], flashMsg = null, opts = null;
  function paintStatus() {
    const s = opts && opts.statusOverride ? opts.statusOverride() : null;
    let [kind, text] = baseStatus;
    if (s) [kind, text] = s;
    else if (flashMsg && Date.now() < flashMsg.until) { kind = "live"; text = flashMsg.text; }
    $("status").className = kind; $("status-text").textContent = text;
  }
  const setStatus = (kind, text) => { baseStatus = [kind, text]; paintStatus(); };
  const flash = (text, ms = 4000) => { flashMsg = { text, until: Date.now() + ms }; paintStatus(); };
  let toastTimer = null;
  function toast(text) { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

  // ------------------------------------------------------------ 3D: textures, sprites, nodes
  function canvasTex(draw, size = 128) { const c = document.createElement("canvas"); c.width = c.height = size; draw(c.getContext("2d"), size); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
  const tex = {
    glow: canvasTex((g, s) => { const r = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.2, "rgba(255,255,255,.5)"); r.addColorStop(.5, "rgba(255,255,255,.1)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, s, s); }),
    ring: canvasTex((g, s) => { g.beginPath(); g.arc(s/2, s/2, s*.36, 0, Math.PI*2); g.lineWidth = s*.08; g.strokeStyle = "#fff"; g.stroke(); }),
    disc: canvasTex((g, s) => { g.beginPath(); g.arc(s/2, s/2, s*.34, 0, Math.PI*2); g.fillStyle = "#fff"; g.fill(); }),
    diamond: canvasTex((g, s) => { g.translate(s/2, s/2); g.rotate(Math.PI/4); g.lineWidth = s*.08; g.strokeStyle = "#fff"; g.strokeRect(-s*.26, -s*.26, s*.52, s*.52); g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(-s*.26, -s*.26, s*.52, s*.52); }),
  };
  const sprite = (map, color, scale, opacity = 1) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map, color, transparent: true, opacity, depthWrite: false, blending: theme.add ? THREE.AdditiveBlending : THREE.NormalBlending })); s.scale.set(scale, scale, 1); return s; };
  const label = (text, color, h, italic) => { const t = new SpriteText(text, h, color); t.fontFace = italic ? "Source Serif 4, Georgia, serif" : "Space Grotesk, Arial, sans-serif"; t.fontWeight = italic ? "400" : "600"; t.material.depthWrite = false; return t; };
  const trim = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

  // Node kinds: center (the course or the question), hub (an interest, topic or theme word),
  // person (a student), leaf (a paper or a response). Every node keeps [material, base opacity]
  // pairs so focus mode can dim it, a pulse halo for hubs, and ripple rings for "being searched".
  function nodeObject(n) {
    const g = new THREE.Group(), mats = [];
    const add = (o, base) => { o.material.transparent = true; o.material.opacity = base; g.add(o); mats.push([o.material, base]); return o; };
    const col = n.kind === "center" ? theme.fg : n.color;
    if (n.kind === "leaf") {
      const r = (n.size || 1.6) + (n.weight || 1) * .8;
      add(sprite(tex.glow, col, r * 7), .45 * theme.glow);

<script>
"use strict";
// Class constellation: students add interests and a research topic; OpenAlex papers gather around each interest.
(() => {

  // ------------------------------------------------------------ graph

    Board.assignColors([...liveTerms.keys()].filter((k) => k !== COURSE_KEY));

      if (people.length) d.append(el("div", people.join(", "), "meta"));
      const ul = el("ul"); ul.style.cssText = "margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4";
      for (const [pid, p] of list.slice(0, 15)) { const li = el("li"), a = el("a", p.title + (p.year ? " (" + p.year + ")" : "")); a.href = "#"; a.onclick = (e) => { e.preventDefault(); const pn = Board.byId("p:" + pid); if (pn) { Board.select(pn); Board.fly(pn); } }; li.append(a); ul.append(li); }

  // ------------------------------------------------------------ join form (opens on demand)
  function openJoin() {
    const pop = $("pop"); pop.replaceChildren(); pop.hidden = false;
    const head = el("div", "", "pophead"), close = el("button", "", "icon"); close.type = "button"; close.innerHTML = svg("close"); close.setAttribute("aria-label", "Close"); close.title = "Close"; close.onclick = () => { pop.hidden = true; };

    const f = el("form"); f.autocomplete = "off";
    const field = (id, text, small, tag = "input") => { const l = el("label"); l.htmlFor = id; l.append(text); if (small) l.append(el("small", small)); const i = el(tag); i.id = id; f.append(l, i); return i; };
    const name = field("me-name", "Your name"); name.maxLength = 60; name.required = true;
    const ints = field("me-interests", "Interests", "Up to five, separated by commas. For example: higher education policy, AI literacy"); ints.maxLength = 240; ints.required = true;
    const topic = field("me-topic", "Sample research topic", "One sentence. It becomes its own node.", "textarea"); topic.maxLength = 200; topic.required = true;
    if (mine) { name.value = mine.name; ints.value = mine.terms.filter((t) => t.kind === "interest").map((t) => t.label).join(", "); topic.value = mine.terms.find((t) => t.kind === "topic")?.label || ""; }
    const save = el("button", mine ? "Update my entry" : "Add me to the map"); save.type = "submit"; save.id = "me-save";
    const msg = el("p", "", "note"); msg.setAttribute("role", "status"); f.append(save, msg); pop.append(f);

      e.preventDefault(); msg.className = "note";
      const interests = [...new Set(ints.value.split(",").map((x) => x.trim()).filter(Boolean))].slice(0, 5).map((x) => x.slice(0, 48));
      const terms = interests.map((label) => ({ key: slug(label), label, kind: "interest" })).filter((t) => t.key);
      if (topic.value.trim()) terms.push({ key: "topic-" + slug(topic.value).slice(0, 50), label: topic.value.trim().slice(0, 200), kind: "topic" });
      if (!name.value.trim() || terms.length < 2) { msg.textContent = "Add your name, at least one interest and a topic."; msg.className = "note warn"; return; }
      const entry = { name: name.value.trim().slice(0, 60), terms, updatedAt: new Date().toISOString() };
      if (!db || !uid) { real.students.set("local", entry); rebuild(); pop.hidden = true; Board.toast("Added in this browser only"); return; }
      save.disabled = true;
      try {
        await db.doc("students/" + uid).set(entry);

        Board.toast("You're on the map"); pop.hidden = true;
        setTimeout(() => { const me = Board.byId("s:" + uid); if (me) { Board.select(me); Board.fly(me); } }, 900);
      } catch (err) { msg.textContent = err && err.code === "quota_exceeded" ? "The board is full. Ask your instructor to clear old papers." : "Could not save. Check your connection and try again."; msg.className = "note warn"; }
      finally { save.disabled = false; }
    };

  }

  // ------------------------------------------------------------ literature worker (OpenAlex)
  // One open tab at a time searches (a short lease on meta/worker). Inside claude.ai the page cannot reach
  // OpenAlex, so the search reports "blocked" and papers arrive from the class worker instead.
  const workerSrc = `function unInvert(idx) { if (!idx) return ""; const w = []; for (const [k, ps] of Object.entries(idx)) for (const i of ps) w[i] = k; return w.filter(Boolean).join(" "); }
self.onmessage = async (e) => {
  const { key, query, since } = e.data;
  const url = "https://api.openalex.org/works?search=" + encodeURIComponent(query) + "&filter=from_publication_date:" + since + ",type:article&sort=relevance_score:desc&per-page=5&select=id,title,publication_year,doi,authorships,primary_location,abstract_inverted_index,open_access,best_oa_location";
  try {
    const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const works = (j.results || []).filter((w) => w.title).map((w) => ({ id: w.id.split("/").pop(), title: w.title, year: w.publication_year || null, doi: w.doi || "", url: w.id,
      venue: (w.primary_location && w.primary_location.source && w.primary_location.source.display_name) || "",
      authors: (w.authorships || []).slice(0, 8).map((a) => a.author && a.author.display_name).filter(Boolean).join(", ") + ((w.authorships || []).length > 8 ? " et al." : ""),
      abstract: unInvert(w.abstract_inverted_index).slice(0, 4000),
      oaUrl: (w.best_oa_location && (w.best_oa_location.landing_page_url || w.best_oa_location.pdf_url)) || (w.open_access && w.open_access.oa_url) || "" }));

  let litWorker = null;

      state.searching.delete(data.key);
      if (data.error) { liveSearch = "blocked"; await db.doc("terms/" + data.key).update({ searchingAt: "" }).catch(() => {}); Board.setStatus("waiting", "Papers arrive from the class worker"); return; }
      liveSearch = "live"; const now = new Date().toISOString();
      for (const w of data.works) { const ref = db.doc("papers/" + w.id), s = await ref.get(); const terms = [...new Set([...(s.exists ? s.data().terms || [] : []), data.key])]; await ref.set({ ...w, terms, addedAt: s.exists ? s.data().addedAt : now }); }
      await db.doc("terms/" + data.key).update({ fetchedAt: now, searchingAt: "" }).catch(() => {});

  }
  async function workerTick() {
    if (!db || liveSearch === "blocked") return;
    const lease = await db.doc("meta/worker").acquire({ holder: tabId, ttlMs: 90000 }).catch(() => ({ acquired: false })); if (!lease.acquired) return;

  // ------------------------------------------------------------ simulation (owner only, this browser only)
  const SIM_INTERESTS = ["AI literacy", "higher education policy", "teacher education", "academic integrity", "learning analytics", "educational equity", "writing pedagogy", "assessment design", "online learning", "research methods", "science communication", "language learners", "STEM education", "educational leadership", "data ethics", "community colleges"];
  const SIM_TOPICS = ["How do %a and %b shape graduate students' research practice?", "What does %a look like in %b after generative AI?", "Where do studies of %a and %b disagree, and why?", "How is %a framed in recent %b research?"];

    if (shared.length && Math.random() < .7) pick[0] = shared[Math.floor(Math.random() * shared.length)];
    const interests = [...new Set(pick)], topic = SIM_TOPICS[n % SIM_TOPICS.length].replace("%a", interests[0]).replace("%b", interests[1] || "higher education");
    const terms = interests.map((label) => ({ key: slug(label), label, kind: "interest" })); terms.push({ key: "topic-sim-" + n, label: topic, kind: "topic" });

  }
  function startSim(count) { stopSim(); Board.refreshFit(); let left = count; const step = () => { if (left-- <= 0) { sim.timer = null; return; } simJoinOne(); sim.timer = setTimeout(step, 1800 + Math.random() * 1200); }; step(); }
  function stopSim() { clearTimeout(sim.timer); sim.timer = null; }
  function clearSim() { stopSim(); sim.students.clear(); sim.papers.clear(); state.searching.clear(); rebuild(); }

  // ------------------------------------------------------------ boot
  $("act-join").onclick = openJoin;
  $("act-link").onclick = () => Board.copyLink();
  Board.init({
    slug: "class-constellation", shareUrl: (window.BOARD_CONFIG || {}).shareUrl,
    rebuild,
    legend: () => [...liveTerms].filter(([, t]) => t.kind !== "topic").map(([key, t]) => ({ key, label: t.label, color: key === COURSE_KEY ? Board.theme().fg : Board.colorFor(key) })),
    tipText: (n) => { if (n.kind === "leaf") { const p = papers().get(n.pid); return p ? p.title + (p.year ? " (" + p.year + ")" : "") : ""; } if (n.kind === "person") return n.label; const k = [...papers().values()].filter((p) => (p.terms || []).includes(n.key)).length; return n.label + " · " + k + (k === 1 ? " paper" : " papers"); },
    captionFor: (n) => { if (n.kind === "leaf") { const p = papers().get(n.pid); return ["Paper · " + labelFor(n.terms[0]), p.title + (p.year ? " (" + p.year + ")" : "")]; } return [n.kind === "center" ? "Course" : n.kind === "person" ? "Student" : n.italic ? "Research topic" : "Interest", n.label]; },
    tourStops: (nodes) => { const hubs = nodes.filter((n) => n.kind === "center" || (n.kind === "hub" && !n.italic)).sort((a, b) => a.kind === "center" ? -1 : b.kind === "center" ? 1 : a.label.localeCompare(b.label)); const out = []; for (const h of hubs) { out.push(h); out.push(...nodes.filter((n) => n.kind === "leaf" && n.terms[0] === h.key).slice(0, 2)); } return out; },
    drawer,
    isBusy: (n) => n.key && isSearching(n.key),
    statusOverride: () => { const keys = [...new Set([...state.terms.keys(), ...liveTerms.keys()])].filter(isSearching); return keys.length ? ["live", "Searching OpenAlex for “" + labelFor(keys[0]) + "”" + (keys.length > 1 ? " and " + (keys.length - 1) + " more" : "") + "…"] : null; },
    snapshotEyebrow: () => "EPOL 590 · Class constellation · " + new Date().toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" }),
    snapshotTitle: () => students().size + " students · " + (liveTerms.size - 1) + " interests · " + Board.nodes().filter((n) => n.kind === "leaf").length + " papers",
    csvRows: () => [["title", "authors", "year", "venue", "interests", "doi", "open_access_url", "openalex"]].concat([...papers().values()].filter((p) => !p.simulated).map((p) => [p.title, p.authors, p.year, p.venue, (p.terms || []).map(labelFor).join("; "), p.doi, p.oaUrl, p.url])),
    moreItems: () => [
      { label: "Replay arrivals", run: Board.replay },
      { label: sim.timer ? "Stop simulation" : "Simulate a class joining", run: () => sim.timer ? stopSim() : startSim(18), show: () => Board.caps().isOwner },
      { label: "Clear simulation", run: clearSim, show: () => sim.students.size > 0 },
    ],
  }).then((caps) => {
    db = caps.db; uid = caps.uid;
    if (!db) { Board.setStatus("waiting", "Offline copy: entries stay in this browser"); rebuild(); return; }
    Board.setStatus("waiting", "Connected");
    db.collection("students").onSnapshot((snap) => { real.students = new Map(snap.docs.map((d) => [d.id, d.data()])); $("act-join").textContent = uid && real.students.has(uid) ? "Edit my entry" : "Join"; rebuild(); },
      () => Board.setStatus("waiting", "Lost the connection. Reload to reconnect."));
    db.collection("terms").onSnapshot((snap) => { state.terms = new Map(snap.docs.map((d) => [d.id, d.data()])); rebuild(); });
    db.collection("papers").orderBy("addedAt", "desc").limit(400).onSnapshot((snap) => {
      real.papers = new Map(snap.docs.map((d) => [d.id, d.data()]));
      const now = performance.now();
      if (!state.seenPapers) [...real.papers.entries()].sort((a, b) => String(a[1].addedAt).localeCompare(String(b[1].addedAt))).forEach(([id], i) => Board.S.bloom.set("p:" + id, now + 900 + i * 240));
      else { const fresh = [...real.papers.keys()].filter((id) => !state.seenPapers.has(id)); fresh.forEach((id, i) => Board.S.bloom.set("p:" + id, now + i * 280)); if (fresh.length) Board.flash("+" + fresh.length + (fresh.length === 1 ? " paper" : " papers") + " just arrived"); }
      state.seenPapers = new Set(real.papers.keys());
      const newest = snap.docs[0]?.data()?.addedAt;
      if (newest && liveSearch !== "live") Board.setStatus(liveSearch === "blocked" ? "waiting" : "", "Papers last added " + new Date(newest).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
      rebuild();
    });
    if (HOSTED) { liveSearch = "server"; return; }
    startWorker(); setTimeout(workerTick, 4000); setInterval(workerTick, 120000);
  });
  rebuild();
})();

</script>

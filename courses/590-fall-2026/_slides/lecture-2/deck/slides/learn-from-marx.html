<section id="learn-from-marx" data-transition="push" style="background:#15161D;color:#F3EEE4;font-family:'Source Serif 4', Georgia, serif;padding:84px 120px 72px;display:flex;flex-direction:column"><div style="display:flex;flex-direction:row;gap:64px;flex:1"><div data-fit style="flex:1;display:flex;flex-direction:column;gap:28px"><h2 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:107px;font-weight:700;line-height:1.1;color:#F3EEE4">Learn from Marx?</h2><div style="width:120px;height:6px;background:#FF7A50;border-radius:3px"></div><div style="display:flex;flex-direction:column;gap:15px"><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 0px"><p data-m style="font-size:51px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">•</p><p style="font-size:51px;line-height:1.4;color:#F3EEE4;flex:1">Order of <b><span style="color:#FF7A50">analysis</span></b> is different from order of <b><span style="color:#FF7A50">presentation</span></b></p></div><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 59px"><p data-m style="font-size:47px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">◦</p><p style="font-size:47px;line-height:1.4;color:#D8D2C6;flex:1">In analysis we go from concrete (stuff we see) to abstract (concepts of thought)</p></div><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 59px"><p data-m style="font-size:47px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">◦</p><p style="font-size:47px;line-height:1.4;color:#D8D2C6;flex:1">In presentation, we go from abstract (concepts) to concrete (the world of experience) - <b><span style="color:#FF7A50">explaining</span></b> the world of experience</p></div></div></div><div style="display:flex;flex-direction:column;gap:24px;justify-content:center"><img src="/_blob/887301bf3a0b4170d6efb0af2bf6b4ba" alt="Image" style="width:820px;height:800px;object-fit:contain;border-radius:14px"></div></div></section>

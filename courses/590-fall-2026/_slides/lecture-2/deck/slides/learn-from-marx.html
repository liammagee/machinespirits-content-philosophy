<li style="font-size:1em;line-height:1.4;color:#F3EEE4;padding-left:0.2em">Order of <strong style="font-weight:700;color:#FF7A50">analysis</strong> is different from order of <strong style="font-weight:700;color:#FF7A50">presentation</strong>
<ul style="padding-left:1.15em;display:flex;flex-direction:column;gap:0.35em;margin-top:0.3em;font-size:0.92em">
<li style="font-size:1em;line-height:1.4;color:#D8D2C6;padding-left:0.2em">In analysis we go from concrete (stuff we see) to abstract (concepts of thought)</li>
<li style="font-size:1em;line-height:1.4;color:#D8D2C6;padding-left:0.2em">In presentation, we go from abstract (concepts) to concrete (the world of experience) - <strong style="font-weight:700;color:#FF7A50">explaining</strong> the world of experience</li>
</ul>
</li>

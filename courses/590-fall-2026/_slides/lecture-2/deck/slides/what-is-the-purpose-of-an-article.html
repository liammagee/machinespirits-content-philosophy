<section id="what-is-the-purpose-of-an-article" data-transition="push" style="background:#15161D;color:#F3EEE4;font-family:'Source Serif 4', Georgia, serif;font-size:52px;padding:84px 120px 72px;display:flex;flex-direction:column"><div data-fit style="display:flex;flex-direction:column;gap:0.55em"><h3 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:1.75em;font-weight:700;line-height:1.15;letter-spacing:-0.01em;color:#F3EEE4">What is the <strong style="font-weight:700;color:#FF7A50">purpose</strong> of an article?</h3><div style="width:120px;height:6px;background:#FF7A50;border-radius:3px;margin:0.1em 0 0.25em"></div><ul style="padding-left:1.15em;display:flex;flex-direction:column;gap:0.35em">
<li style="font-size:1em;line-height:1.4;color:#F3EEE4;padding-left:0.2em">An article makes an <strong style="font-weight:700;color:#FF7A50">argument</strong></li>
<li style="font-size:1em;line-height:1.4;color:#F3EEE4;padding-left:0.2em">As such, it is a form of <strong style="font-weight:700;color:#FF7A50">persuasive</strong> writing
<ul style="padding-left:1.15em;display:flex;flex-direction:column;gap:0.35em;margin-top:0.3em;font-size:0.92em">

<li style="font-size:1em;line-height:1.4;color:#D8D2C6;padding-left:0.2em">But to do so, it must use <strong style="font-weight:700;color:#FF7A50">evidence</strong> (and other things)</li>
</ul>
</li>

<section id="what-is-the-purpose-of-an-article" data-transition="push" style="background:#15161D;color:#F3EEE4;font-family:'Source Serif 4', Georgia, serif;padding:84px 120px 72px;display:flex;flex-direction:column"><div data-fit style="display:flex;flex-direction:column;gap:29px"><h3 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:91px;font-weight:700;line-height:1.1;color:#F3EEE4">What is the <b><span style="color:#FF7A50">purpose</span></b> of an article?</h3><div style="width:120px;height:6px;background:#FF7A50;border-radius:3px"></div><div style="display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 0px"><p data-m style="font-size:52px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">•</p><p style="font-size:52px;line-height:1.4;color:#F3EEE4;flex:1">An article makes an <b><span style="color:#FF7A50">argument</span></b></p></div><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 0px"><p data-m style="font-size:52px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">•</p><p style="font-size:52px;line-height:1.4;color:#F3EEE4;flex:1">As such, it is a form of <b><span style="color:#FF7A50">persuasive</span></b> writing</p></div><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 60px"><p data-m style="font-size:48px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">◦</p><p style="font-size:48px;line-height:1.4;color:#D8D2C6;flex:1">It aims to <b><span style="color:#FF7A50">change the mind</span></b> of a reader</p></div><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 60px"><p data-m style="font-size:48px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">◦</p><p style="font-size:48px;line-height:1.4;color:#D8D2C6;flex:1">But to do so, it must use <b><span style="color:#FF7A50">evidence</span></b> (and other things)</p></div><div style="display:flex;flex-direction:row;gap:23px;padding:0px 0px 0px 0px"><p data-m style="font-size:52px;line-height:1.4;color:#FF7A50;font-weight:700;min-width:31px">•</p><p style="font-size:52px;line-height:1.4;color:#F3EEE4;flex:1">All the parts of an article should contribute to this aim: <b><span style="color:#FF7A50">persuasion</span></b></p></div></div></div></section>

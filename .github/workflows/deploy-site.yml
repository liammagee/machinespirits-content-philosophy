name: Deploy Site on Content Update

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content package
        uses: actions/checkout@v6

      # Validate the committed publication package. Do not run ./build here:
      # Git checkouts do not preserve meaningful source/output mtimes, so a
      # clean runner would rebuild arbitrary Markdown and overwrite managed
      # HTML even when the committed package is already current.
      - name: Validate committed deployable package
        run: ./validate

      - name: Require validation to be read-only
        run: git diff --exit-code

  trigger-deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger main site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MAIN_REPO_PAT }}
          repository: liammagee/machinespirits
          event-type: content-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

name: Validate Public Content Package

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content package
        uses: actions/checkout@v6

      # Validate the committed publication package. Do not run ./build here:
      # Git checkouts do not preserve meaningful source/output mtimes, so a
      # clean runner would rebuild arbitrary Markdown and overwrite managed
      # HTML even when the committed package is already current.
      - name: Validate committed deployable package
        run: ./validate

      - name: Require validation to be read-only
        run: git diff --exit-code

  handoff:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Record pull-owned deployment handoff
        run: |
          echo "Validated content revision $GITHUB_SHA."
          echo "The website repository resolves and pins content master on deploy,"
          echo "and its scheduled drift check deploys this revision when production differs."

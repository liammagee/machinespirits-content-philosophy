name: Deploy Site on Content Update

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content package
        uses: actions/checkout@v6

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build stale Markdown
        run: ./build

      - name: Validate deployable package
        run: ./validate

      - name: Require generated HTML to be committed
        run: git diff --exit-code -- articles courses

  trigger-deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger main site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MAIN_REPO_PAT }}
          repository: liammagee/machinespirits
          event-type: content-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
